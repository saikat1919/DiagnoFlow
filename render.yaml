# Render Blueprint for DiagnoFlow.
# Put this file in the REPO ROOT (next to docker-compose.yaml) and create
# a Blueprint in the Render dashboard, or push it and let Render detect it.
#
# Services:
#   diagnoflow-db        Render Postgres (pgvector extension is created by
#                        scripts/init-db.sql on first boot)
#   diagnoflow-embedder  Text Embeddings Inference (optional: only needed
#                        for knowledge search / ingest / chatbot search.
#                        CRUD, orders, reports and sales work without it.)
#   diagnoflow-api       FastAPI backend (existing Dockerfile at repo root)
#   diagnoflow-frontend  React frontend (frontend/Dockerfile, nginx)
#
# IMPORTANT — replace the placeholder hostnames/URLs with your real
# Render service URLs after the first deploy, then redeploy:
#   * API_URL on the frontend must be the PUBLIC backend URL.
#   * CORS_ORIGINS on the backend must be the PUBLIC frontend URL.
#   * EMBEDDINGS_URL must point at the embedder's internal address
#     (check the embedder service page in Render; if it does not work,
#     delete the embedder service and leave EMBEDDINGS_URL empty — the
#     API will start, and only search/ingest will fail until it is set).
# Before deploying, apply the CORS patch in CORS_PATCH.md to the backend,
# otherwise the browser will block every frontend -> backend call.

databases:
  - name: diagnoflow-db
    databaseName: diagnoflow
    user: diagnoflow
    plan: free
    # Postgres 16+ on Render. The app uses the `diagnoflow` schema;
    # set DB_SCHEMA=diagnoflow below and let init-db.sql create it.
    # NOTE: the repo's init-db.sql is wired to docker-entrypoint-initdb.d
    # in docker-compose only. On Render, run it once manually against the
    # new database (psql) so the schema + vector extension exist, then
    # run `alembic upgrade head` from the backend service shell.

services:
  - type: pserv
    name: diagnoflow-embedder
    env: docker
    image:
      url: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
    dockerCommand: --model-id unsloth/embeddinggemma-300m
    plan: starter
    disk:
      name: embedder-cache
      mountPath: /data
      sizeGB: 2

  - type: web
    name: diagnoflow-api
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: diagnoflow-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: diagnoflow-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: diagnoflow-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: diagnoflow-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: diagnoflow-db
          property: database
      - key: DB_SCHEMA
        value: diagnoflow
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_MINUTES
        value: "60"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      # Replace with the embedder's internal address (see note at top).
      - key: EMBEDDINGS_URL
        value: http://diagnoflow-embedder:80
      # Replace with the PUBLIC frontend URL after the first deploy.
      - key: CORS_ORIGINS
        value: https://diagnoflow-frontend.onrender.com

  - type: web
    name: diagnoflow-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: starter
    healthCheckPath: /
    envVars:
      # Replace with the PUBLIC backend URL after the first deploy.
      - key: API_URL
        value: https://diagnoflow-api.onrender.com
