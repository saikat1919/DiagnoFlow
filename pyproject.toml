[project]
name = "diagnoflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "saikat1919", email = "saikat.saikat411@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.163.1",
    "pwdlib[argon2]>=0.4.2",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.8",
]

[project.scripts]
diagnoflow = "diagnoflow:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
